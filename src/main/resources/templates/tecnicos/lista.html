<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Técnicos', 'tecnicos', ~{::section})}">
<body>
<section>
  <header class="topo">
    <h1>Técnicos</h1>
    <a class="botao" th:href="@{/web/tecnicos/novo}">Novo técnico</a>
  </header>

  <p class="vazio" th:if="${#lists.isEmpty(tecnicos)}">Nada cadastrado ainda. Use o botão "Novo técnico" para criar o primeiro.</p>

  <div class="rolagem" th:unless="${#lists.isEmpty(tecnicos)}">
    <table>
      <thead>
        <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ações</th></tr>
      </thead>
      <tbody>
        <tr th:each="t : ${tecnicos}">
          <td th:text="${t.nome()}">Nome</td>
          <td th:text="${t.email()}">email@exemplo.com</td>
          <td th:text="${t.perfil().rotulo}">Técnico</td>
          <td class="acoes">
            <a th:href="@{|/web/tecnicos/${t.id()}/editar|}">Editar</a>
            <form method="post" th:action="@{|/web/tecnicos/${t.id()}/excluir|}"
                  th:attr="data-confirma=|Excluir o técnico ${t.nome()}?|">
              <button type="submit" class="link perigo">Excluir</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
