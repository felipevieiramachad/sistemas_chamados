<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Categorias', 'categorias', ~{::section})}">
<body>
<section>
  <header class="topo">
    <h1>Categorias</h1>
    <a class="botao" th:href="@{/web/categorias/novo}">Nova categoria</a>
  </header>

  <p class="vazio" th:if="${#lists.isEmpty(categorias)}">Nada cadastrado ainda. Use o botão "Nova categoria" para criar a primeira.</p>

  <div class="rolagem" th:unless="${#lists.isEmpty(categorias)}">
    <table>
      <thead>
        <tr><th>Nome</th><th>Descrição</th><th>Ações</th></tr>
      </thead>
      <tbody>
        <tr th:each="c : ${categorias}">
          <td th:text="${c.nome()}">Nome</td>
          <td th:text="${c.descricao() != null} ? ${c.descricao()} : '—'">Descrição</td>
          <td class="acoes">
            <a th:href="@{|/web/categorias/${c.id()}/editar|}">Editar</a>
            <form method="post" th:action="@{|/web/categorias/${c.id()}/excluir|}"
                  th:attr="data-confirma=|Excluir a categoria ${c.nome()}?|">
              <button type="submit" class="link perigo">Excluir</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
